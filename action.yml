name: "KiCad actions"
description: "A GitHub action that can generate and check KiCad schematics and PCBs."
branding:
  icon: "cpu"
  color: "green"

inputs:
  # Project file
  project_file_name:
    description: "The project file, used for running a jobset. Not required if there is a single `.kicad_pro` file in the working directory."

  # Schematic input file
  schematic_file_name:
    description: "Location of the '.kicad_sch' file."

  # Symbol library file
  symbol_libraries:
    description: "Comma-separated list of symbol libraries in the format name=path."

  # ERC run
  run_erc:
    description: "Run the ERC on the schematic."
    default: false

  erc_output_file_name:
    description: "Output file name of ERC report."
    default: "erc.rpt"

  # Schematic PDF output
  schematic_output_pdf:
    description: "Run the PDF export of the schematic."
    default: false

  schematic_output_pdf_file_name:
    description: "Output file name of PDF schematic."
    default: "schematic.pdf"

  schematic_output_black_white:
    description: "Run the PDF, SVG, DXF and PS schematic export in black and white."
    default: false

  schematic_output_pages:
    description: "Comma-separated list of schematic pages to include in exports."

  # Schematic SVG output
  schematic_output_svg:
    description: "Run the SVG export of the schematic."
    default: false

  schematic_output_svg_folder_name:
    description: "Output folder name of SVG schematic."
    default: "schematics"

  # Schematic DXF output
  schematic_output_dxf:
    description: "Run the DXF export of the schematic."
    default: false

  schematic_output_dxf_folder_name:
    description: "Output folder name of DXF schematic."
    default: "schematics"

  # Schematic PS output
  schematic_output_ps:
    description: "Run the PS export of the schematic."
    default: false

  schematic_output_ps_folder_name:
    description: "Output folder name of PS schematic."
    default: "schematics"

  # Schematic BOM output
  schematic_output_bom:
    description: "Run the BOM export of the schematic."
    default: false

  schematic_output_bom_file_name:
    description: "Output file name of the BOM."
    default: "bom.csv"

  schematic_output_bom_fields:
    description: "Output fields in the BOM file. `*` includes all fields."
    default: "Reference,Value,Footprint,${QUANTITY},${DNP}"

  schematic_output_bom_labels:
    description: "Output labels in the BOM file."
    default: "Refs,Value,Footprint,Qty,DNP"

  # Schematic netlist output
  schematic_output_netlist:
    description: "Run the netlist export of the schematic."
    default: false

  schematic_output_netlist_file_name:
    description: "Output file name of the netlist."
    default: "netlist.net"

  # Schematic netlist output (XML format)
  schematic_output_xml_netlist:
    description: "Run the XML netlist export of the schematic."
    default: false

  schematic_output_xml_netlist_file_name:
    description: "Output file name of the XML netlist."
    default: "netlist.xml"

  # PCB input file
  pcb_file_name:
    description: "Location of the '.kicad_pcb' file."

  # Footprint library file
  footprint_libraries:
    description: "Comma-separated list of footprint libraries in the format name=path."

  # DRC run
  run_drc:
    description: "Run the DRC on the PCB."
    default: false

  drc_output_file_name:
    description: "Output file name of DRC report."
    default: "drc.rpt"

  # PCB drill output
  pcb_output_drill:
    description: "Run the drill export of the PCB."
    default: false

  pcb_output_drill_folder_name:
    description: "Output folder name of drill file."
    default: "drill"

  pcb_output_drill_format:
    description: "Format of the drill file. Options: 'excellon', 'gerber'."
    default: "excellon"

  pcb_output_drill_split:
    description: "Split drill file into plated and non-plated counterparts."
    default: false

  # PCB gerbers output
  pcb_output_gerbers:
    description: "Run the gerber export of the PCB."
    default: false

  pcb_output_gerbers_folder_name:
    description: "Output folder name of gerber files."
    default: "gerbers"

  pcb_output_layers:
    description: "Output layers of the PCB."

  # PCB gerbers and drill output
  pcb_output_gerbers_and_drill:
    description: "Run the gerber and drill export of the PCB."
    default: false

  pcb_output_gerbers_and_drill_folder_name:
    description: "Output folder name of gerber and drill files."
    default: "gerbers"

  # Pcb DXF output
  pcb_output_dxf:
    description: "Run the DXF export of the PCB."
    default: false

  pcb_output_dxf_folder_name:
    description: "Output folder name of DXF PCB."
    default: "dxf"

  # Pcb PDF output
  pcb_output_pdf:
    description: "Run the PDF export of the PCB."
    default: false

  pcb_output_pdf_file_name:
    description: "Output file name of PDF PCB."
    default: "pcb.pdf"

  pcb_output_black_white:
    description: "Run the PDF and SVG PCB export in black and whit."
    default: false

  # Pcb SVG output
  pcb_output_svg:
    description: "Run the SVG export of the PCB."
    default: false

  pcb_output_svg_file_name:
    description: "Output file name of SVG PCB."
    default: "pcb.svg"

  # Pcb POS output
  pcb_output_pos:
    description: "Run the POS export of the PCB."
    default: false

  pcb_output_pos_file_name:
    description: "Output file name of POS PCB."
    default: "pcb.pos"

  pcb_output_pos_format:
    description: "Format of the pos file. Options: 'ascii', 'csv', 'gerber'."
    default: "ascii"

  pcb_output_pos_side:
    description: "Side of the post file. Options: 'front', 'back', 'both'. Both is not supported by gerber."
    default: "both"

  # PCB IPC-2581 output
  pcb_output_ipc2581:
    description: "Run the IPC-2581 export of the PCB."
    default: false

  pcb_output_ipc2581_file_name:
    description: "Output file name of IPC-2581 PCB."
    default: "pcb.xml"

  # PCB STEP output
  pcb_output_step:
    description: "Run the STEP export of the PCB."
    default: false

  pcb_output_step_file_name:
    description: "Output file name of STEP PCB."
    default: "pcb.step"

  # PCB GLB output
  pcb_output_glb:
    description: "Run the GLB (binary glTF) export of the PCB. See docs/glb-export.md for what the defaults do and why."
    default: false

  pcb_output_glb_file_name:
    description: "Output file name of GLB PCB."
    default: "pcb.glb"

  # GLB visual content
  pcb_output_glb_soldermask:
    description: "Export the soldermask layers. Without this the board body is flat-coloured instead."
    default: true

  pcb_output_glb_silkscreen:
    description: "Export the silkscreen graphics."
    default: true

  pcb_output_glb_pads:
    description: "Export pads. These are the copper you actually see, through the soldermask openings."
    default: true

  pcb_output_glb_tracks:
    description: "Export tracks and vias. Hidden under an opaque soldermask, so off by default."
    default: false

  pcb_output_glb_zones:
    description: "Export copper zones. Hidden under an opaque soldermask, so off by default."
    default: false

  pcb_output_glb_inner_copper:
    description: "Export inner copper layers. Never visible from outside the board."
    default: false

  pcb_output_glb_components:
    description: "Include component 3D models."
    default: true

  pcb_output_glb_board_only:
    description: "Export only the bare board, with no components."
    default: false

  pcb_output_glb_component_filter:
    description: "Only include component 3D models matching this comma-separated list of reference designators. Wildcards supported."

  pcb_output_glb_net_filter:
    description: "Only include copper items belonging to nets matching this wildcard."

  pcb_output_glb_no_dnp:
    description: "Exclude 3D models for components marked 'Do not populate'."
    default: false

  pcb_output_glb_no_unspecified:
    description: "Exclude 3D models for components with an 'Unspecified' footprint type."
    default: false

  pcb_output_glb_subst_models:
    description: "Substitute STEP or IGS models for VRML models with the same name."
    default: false

  pcb_output_glb_fuse_shapes:
    description: "Fuse overlapping geometry together. Slower, but reduces coincident surfaces."
    default: false

  pcb_output_glb_min_distance:
    description: "Minimum distance between points to treat them as separate ones."
    default: "0.01mm"

  pcb_output_glb_origin:
    description: "Origin of the exported model. Options: 'board', 'grid', 'drill', or an explicit offset such as '25.4x25.4mm'."
    default: "board"

  # GLB post-processing for real-time renderers
  pcb_output_glb_optimize:
    description: "Post-process the GLB for real-time renderers such as PlayCanvas, three.js or Babylon: fill in missing PBR values, make the board opaque, enable backface culling, and give nodes and materials readable names."
    default: true

  pcb_output_glb_center:
    description: "Recentre the model on the board bounding box so it orbits around itself. Requires 'pcb_output_glb_optimize'."
    default: true

  pcb_output_glb_scale:
    description: "Uniform scale applied to the exported model. glTF units are metres, so a 100 mm board is 0.1 units at the default scale of 1."
    default: "1.0"

  pcb_output_glb_detect_metals:
    description: "Treat unsaturated mid-grey component colours as bare metal, so leads and shields render metallic instead of as grey plastic."
    default: true

  pcb_output_glb_metal_colors:
    description: "Comma-separated hex colours whose component materials are forced metallic, for example 'EDBE51,97A3DA'. Overrides the colour heuristic, which cannot tell gold plating or a nickel connector shell from plastic. Board layers are never affected."

  pcb_output_glb_keep_transparency:
    description: "Keep the board, soldermask and silkscreen as blended transparent materials, as KiCad exports them. These sort badly in real-time renderers."
    default: false

  pcb_output_glb_mask_opacity:
    description: "Opacity of the soldermask, above 0 and up to 1. Below 1 the mask alone stays a blended material, so copper under it shows through tinted like on a real board. Pair with 'pcb_output_glb_tracks' and 'pcb_output_glb_zones'. KiCad's own value is 0.83. Requires 'pcb_output_glb_optimize'."
    default: "1.0"

  # PCB image output
  pcb_output_image:
    description: "Run the image export of the PCB."
    default: false

  pcb_output_image_file_name:
    description: "Output file name of image PCB. Must end in '.png', '.jpg', '.jpeg'."
    default: "pcb.png"

  pcb_output_image_side:
    description: "Side of the image PCB. Options: 'top', 'bottom', 'left', 'right', 'front', 'back'."
    default: "top"

  pcb_output_image_background:
    description: "Background of the image PCB. Options: 'default', 'transparent', 'opaque'. For PNG files, default is transparent. For JPG files, default is opaque."
    default: "default"

  pcb_output_image_width:
    description: "Width of the image PCB in pixels."
    default: "1600"

  pcb_output_image_height:
    description: "Height of the image PCB in pixels."
    default: "900"

  pcb_output_image_floor:
    description: "Enables floor, shadows and post-processing."
    default: false

  pcb_output_image_perspective:
    description: "Enables perspective view."
    default: false

  pcb_output_image_quality:
    description: "Quality of the image PCB. Options: 'basic', 'high', 'user'."
    default: "basic"

  pcb_output_image_zoom:
    description: "Zoom factor of the image PCB."
    default: "1.0"

  pcb_output_image_rotate:
    description: "Rotation of the image PCB. Format: 'x,y,z'."
    default: "0,0,0"

  # Jobset
  jobset_file_name:
    description: "Run a predefined KiCad jobset file."

runs:
  using: "docker"
  image: "Dockerfile"
